setups:
  - setup_id: SME_TACTICAL_SWING_V1
    setup_name: SME tactical swing
    setup_family: SME_TACTICAL
    holding_horizon_note: 3 days to 6 weeks
    screeners:
      - sme-momentum-screen-v1
      - midcap-improver-screen-v1
    screener_mode: union
    dynamic_sources:
      - market_scan
      - volume_surge
      - momentum
    allowed_regimes:
      - BULL_RISK_ON
      - BULL_NARROW
      - STABLE
      - STABLE_BUT_TARIFF_RISING
      - RISK_OFF
    blocked_regimes:
      - SHOCK
    allowed_overlays:
      - NONE
      - EVENT_CLUSTER
      - SECTOR_POLICY_SHOCK
      - TARIFF_PRESSURE
    blocked_overlays:
      - GEOPOLITICAL_RISK
      - OIL_SHOCK
    overlay_screeners:
      EVENT_CLUSTER:
        add:
          - midcap-improver-screen-v1
      TARIFF_PRESSURE:
        add:
          - midcap-improver-screen-v1
    market_cap_max: 10000
    min_avg_traded_value_20d: 15000000
    max_breakout_extension_pct: 8
    watch_pullback_extension_pct: 5
    min_dist_52w_high: -18
    scoring_weights:
      technical: 0.45
      fundamental: 0.20
      regime_fit: 0.20
      event: 0.15
    freshness_policy:
      technical_max_age_days: 15
      fundamentals_max_age_days: 150
      regime_max_age_days: 15
      intraday_max_age_days: 2
      fundamentals_required: true
    intraday_usage_mode: timing_only
    risk_profile:
      base_risk_bucket: high
      max_allocation_inr: 25000
      invalidation_anchor: dma_20
    portfolio_cap_pct: 0.20
    score_thresholds:
      pass_now: 0.66
      watch_breakout: 0.56
      watch_pullback: 0.52
      watch_event: 0.48
      near_miss_gap: 0.06
    regime_policy:
      preferred:
        - BULL_RISK_ON
        - BULL_NARROW
      acceptable:
        - STABLE
      avoid:
        - STABLE_BUT_TARIFF_RISING
        - RISK_OFF
    technical_rules:
      - column: pass_above_dma_20
        operator: eq
        value: true
      - column: pass_above_dma_50
        operator: eq
        value: true
      - column: atr_compression_pct
        operator: lte
        value: 0.75
      - column: rs_vs_benchmark
        operator: gte
        value: 0.0
    intraday_rules:
      - column: intraday_close_vs_vwap_pct
        operator: gte
        value: 0.0
      - column: intraday_pct_bars_above_vwap
        operator: gte
        value: 0.48
    watch_reasons:
      - results
      - order wins
      - capacity expansion
      - promoter or pledge changes
      - governance issues
      - dilution
    entry_styles:
      - BREAKOUT_PIVOT
      - BREAKOUT_PLUS_EXTENSION_BAND
      - RETEST_OF_PRIOR_BREAKOUT

