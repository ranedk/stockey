# STRESS-TEST hypotheses (breadth over precision) to surface system constraints.
# Generated; all active_review (ground nothing). Includes [price] anomalies that the
# news-keyword matcher cannot express on purpose. See docs/hypothesis_authoring.md.
hypotheses:
- hypothesis_id: STRESS_GUIDANCE_RAISE
  title: Guidance raised / outlook upgraded
  source: stress_test_knowledge_base
  status: active_review
  trigger_scope: symbol
  trigger_patterns:
    keywords:
      include:
      - raised guidance
      - guidance raised
      - outlook upgraded
      - raises outlook
      - upward revision in guidance
      exclude:
      - guidance cut
      - lowered guidance
  expected_effect: &id002
    effect: increase_exposure
    market_direction: positive
    action_bias: buy_watch
  holding_window:
    horizons_days:
    - 5
    - 10
    - 20
  decision_policy:
    min_terms: 1
    confirmation_required: true
  validation_protocol:
    method: point_in_time_forward_return
    benchmark: NIFTY
    costs_bps: 25
