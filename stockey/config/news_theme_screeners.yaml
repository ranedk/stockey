themes:
  - theme_id: PHARMA_EXPORT_SHIFT
    theme_name: Pharma Export Shift
    keywords:
      - pharma
      - drug
      - usfda
      - us law
      - import restriction
      - china plus one
      - api
      - formulation
    positive_sectors:
      - pharma
      - healthcare
      - api
    suggested_screeners:
      - slug: news-pharma-export-shift-v1
        screener_name: NEWS PHARMA EXPORT SHIFT V1
        holding_horizon_note: 2 weeks to 3 months
        screener_query: |
          Market Capitalization > 1000 AND
          Sales growth 3Years > 8 AND
          Return on capital employed > 12 AND
          Debt to equity < 1 AND
          Promoter holding > 35 AND
          Price to earning < 60
      - slug: news-pharma-quality-us-opportunity-v1
        screener_name: NEWS PHARMA QUALITY US OPPORTUNITY V1
        holding_horizon_note: 1 month to 3 months
        screener_query: |
          Market Capitalization > 3000 AND
          Return on equity > 12 AND
          Profit growth 3Years > 8 AND
          Debt to equity < 0.8 AND
          Current price > 200 Day Moving Average

