catalog_version: 1
default_asof_timezone: UTC

themes:
  - theme_id: DOMESTIC_CAPEX_INDUSTRIALS
    name: Domestic Capex Industrials
    status: active
    description: Multi-year domestic capex, manufacturing, and infra buildout theme.
    classification:
      family: domestic_capex
      sector_bias: [industrials, capital_goods, engineering, infrastructure]
      market_cap_fit: [large_cap, mid_cap, strong_small_cap]
      holding_profile: structural
      holding_period_days: {min: 180, max: 1825}
      risk_level: medium
      exit_trigger_types: [thesis, fundamental, technical]
    detection:
      keywords:
        include: [capex, industrial, manufacturing, order book, infra spend, domestic demand, project award]
        exclude: []
      match:
        title_weight: 2.0
        description_weight: 1.0
        min_hit_score: 2
        max_titles_for_reason: 3
    routing:
      primary_pipeline: event_opportunity_pipeline
      downstream_agents: [news_theme_expert, screener_designer, advisory_logic_expert]
      output_mode: idea_candidates
      priority: 70
    screener_templates:
      - template_id: domestic-capex-industrials-v1
        provider: screenerin
        slug: domestic-capex-industrials-v1
        label: DOMESTIC CAPEX INDUSTRIALS V1
        horizon: structural
        holding_horizon_note: 2 to 5 years
        entry_style: breakout_or_quality_pullback
        query: |
          Market Capitalization > 1500 AND
          Sales growth 3Years > 10 AND
          Profit growth 3Years > 10 AND
          Return on capital employed > 14 AND
          Debt to equity < 1.2 AND
          Current price > DMA 200
    decay:
      model: slow
      half_life_days: 60
      max_active_days: 365
      refresh_on_new_match: true
      cooldown_days: 14
    portfolio_guidance:
      positive_sectors: [industrials, capital_goods, engineering, infrastructure]
      ideal_screener_logic: order-book growth, earnings growth, debt discipline, RS leadership, base breakout
      invalidation_signals:
        - capex cycle weakens
        - execution slips for multiple quarters
        - order inflow slows materially
        - weekly structure breaks

